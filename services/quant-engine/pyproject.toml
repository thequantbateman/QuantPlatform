[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thequantbateman-quant-engine"
version = "0.1.0"
description = "Transparent analytical pricing service for TheQuantBateman"
requires-python = ">=3.9"
dependencies = [
  "fastapi==0.116.1",
  "numpy==2.0.2",
  "pydantic==2.11.7",
  "scipy==1.13.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
validation = ["QuantLib==1.39"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
